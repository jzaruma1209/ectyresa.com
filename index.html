<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="ECTYRE S.A. – Importadores y distribuidores autorizados de llantas en Ecuador. Encuentra llantas para auto, camión, maquinaria y más. Envíos a nivel nacional."
    />
    <meta name="theme-color" content="#E60000" />

    <title>ECTYRE S.A. - Importadores y Distribuidores de Llantas</title>
    <link rel="canonical" href="https://www.ectyre.com/" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, X). Las redes no ejecutan JS: leen estas etiquetas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ECTYRE S.A." />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="ECTYRE S.A. - Importadores y Distribuidores de Llantas" />
    <meta property="og:description" content="Llantas para auto, camioneta, camión y maquinaria en Ecuador. Pide por WhatsApp y recibe en todo el país." />
    <meta property="og:url" content="https://www.ectyre.com/" />
    <meta property="og:image" content="https://www.ectyre.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ECTYRE S.A. - Llantas en Ecuador" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect a recursos externos críticos -->
    <!-- Cloudinary CDN — imágenes de productos -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- API Backend -->
    <link rel="preconnect" href="https://ectyre-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://ectyre-backend.vercel.app" />

    <!-- Google Fonts — fuente única de verdad: Inter + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
