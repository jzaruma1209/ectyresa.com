<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Compra llantas para autos, camionetas y otros vehículos en ECTYRE S.A., La Troncal, Cañar. Consulta marcas, medidas y disponibilidad. Atención en nuestro local y envíos a Ecuador, según cobertura."
    />
    <meta name="theme-color" content="#E60000" />

    <title>ECTYRE S.A. | Llantas en La Troncal, Cañar</title>

    <!-- Vista previa al compartir (WhatsApp, Facebook, X). Las redes no ejecutan JS: leen estas etiquetas.
         Sin canonical ni og:url fijos: este HTML se sirve en todas las rutas y usePageMeta los define por página. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ECTYRE S.A." />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="ECTYRE S.A. | Llantas en La Troncal, Cañar" />
    <meta property="og:description" content="Compra llantas para autos, camionetas y otros vehículos en ECTYRE S.A., La Troncal, Cañar. Consulta marcas, medidas y disponibilidad. Atención en nuestro local y envíos a Ecuador, según cobertura." />
    <meta property="og:image" content="https://www.ectyre.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ECTYRE S.A. - Llantas en Ecuador" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos del negocio local para Google Search y Maps. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://www.ectyre.com/#negocio",
        "name": "ECTYRE S.A.",
        "description": "Tienda de llantas para auto, camioneta, camión y maquinaria en La Troncal, Cañar, con instalación y envíos a todo Ecuador.",
        "url": "https://www.ectyre.com/",
        "image": "https://www.ectyre.com/og-image.jpg",
        "telephone": "+593999601748",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. 25 de Agosto y calle Galápagos",
          "addressLocality": "La Troncal",
          "addressRegion": "Cañar",
          "addressCountry": "EC"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -2.43048,
          "longitude": -79.33602
        }
      }
    </script>

    <!-- Preconnect a recursos externos críticos -->
    <!-- Cloudinary CDN — imágenes de productos -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- API Backend -->
    <link rel="preconnect" href="https://ectyre-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://ectyre-backend.vercel.app" />

    <!-- Google Fonts — fuente única de verdad: Inter + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
